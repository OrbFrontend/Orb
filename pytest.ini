[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = .
testpaths = tests
markers =
    real_model_dir: this test is about where backend/data/models/ resolves, so it opts out of the
        conftest fixture that points model_dir() at an empty directory (see tests/conftest.py)
    kv_divergence_expected: this test deliberately diverges prompt prefixes mid-conversation (e.g. persona or settings switch — a user-driven cache invalidation); skips the llm_mock KV-prefix invariant teardown check
