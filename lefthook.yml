# Lefthook configuration for Orb
# Docs: https://github.com/evilmartians/lefthook/blob/master/docs/configuration.md

pre-commit:
  parallel: true
  commands:
    format-python:
      glob: "*.py"
      run: python3 -m ruff check --select I --fix --quiet {staged_files} && python3 -m ruff format --quiet {staged_files}
      stage_fixed: true

    format-js:
      glob: "frontend/*.js"
      exclude: "frontend/vendor/**"
      run: npx biome format --write {staged_files}
      stage_fixed: true

    lint-python:
      glob: "*.py"
      run: python3 -m ruff check {staged_files}
